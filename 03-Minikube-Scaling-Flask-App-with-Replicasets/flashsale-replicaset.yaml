apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: flashsale-replicaset
  labels:
    app: flashsale
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flashsale
  template:
    metadata:
      labels:
        app: flashsale
    spec:
      containers:
        - name: flashsale
          image: flashsale-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: flashsale-service
spec:
  type: NodePort
  selector:
    app: flashsale
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
